name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    name: Typecheck + tests (shared/sidecar/desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck shared
        run: pnpm --filter @streamtok/shared exec tsc --noEmit -p .

      - name: Typecheck sidecar
        run: pnpm --filter @streamtok/sidecar exec tsc --noEmit -p .

      - name: Test sidecar (vitest)
        run: pnpm --filter @streamtok/sidecar test

      - name: Typecheck desktop (frontend)
        run: pnpm --filter @streamtok/desktop exec tsc -p tsconfig.json --noEmit

  rust-check:
    name: cargo check (Tauri, Windows)
    # El Rust de src-tauri usa APIs de Windows (crate `windows`) detrás de
    # #[cfg(target_os = "windows")] — correrlo en un runner de Windows es lo
    # único que valida esa parte de verdad. Es más lento que ubuntu, así que
    # es un job separado y no bloquea el feedback rápido de arriba.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check
        # sin --locked: todavía no hay Cargo.lock committeado (nadie corrió
        # `cargo build` en Windows aún). Una vez exista, agregar --locked.
